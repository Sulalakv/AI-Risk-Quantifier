<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPARQ – AI Risk Quantifier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>


    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ----- THEME COLORS ----- */
        :root {
            --sparq-main: #30880aff;
            --sparq-hover: #118EAD;
        }

        /* ----- NAVBAR ----- */
        .navbar-custom {
            background-color: var(--sparq-main) !important;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 24px;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
        }

        .nav-link:hover {
            opacity: 0.85;
        }

        /* ----- CARDS ----- */
        .card {
            border-radius: 14px;
            border: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        /* ----- BUTTONS ----- */
        .btn-sparq {
            background-color: var(--sparq-main);
            border-color: var(--sparq-main);
            color: white;
            font-weight: 600;
        }

        .btn-sparq:hover {
            background-color: var(--sparq-hover);
            border-color: var(--sparq-hover);
            color: white;
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            background: var(--sparq-main);
            color: white;
            text-align: center;
            border-top: 1px solid #0f6f82;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom" style="padding-left:40px; padding-right:40px;">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">SPARQ</a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2025 SPARQ – Software Project AI Risk Quantifier
</footer>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
